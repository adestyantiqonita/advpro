<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Product</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auUHCwJj13lvopF1BmIDj0kn/AErCwvK8fPUOr" 
        crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <h3>Create New Product</h3>
    
    <!-- Form with Thymeleaf binding -->
    <form th:action="@{/product/create}" th:object="${product}" method="post">
        <!-- Product Name Field -->
        <div class="form-group">
            <label for="nameInput">Product Name</label>
            <input th:field="*{productName}" 
                   type="text" 
                   class="form-control mb-4 col-4" 
                   id="nameInput" 
                   placeholder="Enter product's name" 
                   required>
        </div>
        
        <!-- Product Quantity Field -->
        <div class="form-group">
            <label for="quantityInput">Quantity</label>
            <input th:field="*{productQuantity}" 
                   type="number" 
                   class="form-control mb-4 col-4" 
                   id="quantityInput" 
                   placeholder="Enter product's quantity" 
                   min="1" 
                   required>
        </div>
        
        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

<!-- Bootstrap Bundle JS -->
<script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" 
    crossorigin="anonymous">
</script>
</body>
</html>
